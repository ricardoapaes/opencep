name: CI/CD - OpenCEP API

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=pr,prefix=pr-
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Test Rust address index and API
        uses: docker/build-push-action@v5
        with:
          context: .
          target: rust-tests
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build fixture search image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: search-server-test
          load: true
          tags: opencep-search:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build fixture Nginx image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: nginx-server-test
          load: true
          tags: opencep-nginx:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test local reverse search through Nginx
        run: |
          compose_files="-f docker-compose.yml -f docker-compose.ci.yml"
          cleanup() {
            docker compose $compose_files down --remove-orphans
          }
          trap cleanup EXIT

          if ! docker compose $compose_files up -d --no-build --wait --wait-timeout 60; then
            docker compose $compose_files ps -a || true
            docker compose $compose_files logs --no-color || true
            container_id="$(docker compose $compose_files ps -q cep-search)"
            if [ -n "$container_id" ]; then
              docker inspect --format='{{json .State.Health}}' "$container_id" || true
            fi
            exit 1
          fi
          curl -fsS http://localhost:8080/ready > /tmp/opencep-ready.json

          jq -e '.status == "ready" and .dataset_version == "ci-fixture" and .document_count == 9' \
            /tmp/opencep-ready.json
          curl -fsS 'http://localhost:8080/ws/SP/Sao%20Paulo/Paulsta/json/?limit=10' \
            | jq -e 'any(.[]; .cep == "01310-100" and .logradouro == "Avenida Paulista")'
          curl -fsS 'http://localhost:8080/ws/PR/Campo%20Mour%C3%A3o/Rua%20Quinto%20Salvadori,1774/json/?limit=10' \
            | jq -e 'length == 1 and .[0].cep == "87308-084"'

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: opencep-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container for testing
        run: |
          docker run -d --name opencep-test -p 8080:80 opencep-api:test
          sleep 5

      - name: Test - Default DNS template and proxy
        run: |
          docker exec opencep-test nginx -t
          docker exec opencep-test sh -c '
            config=/etc/nginx/conf.d/default.conf
            grep -Fq "resolver 1.1.1.1 valid=300s ipv6=off;" "$config" &&
            grep -Fq '\''proxy_pass https://$viacep_host$request_uri;'\'' "$config" &&
            grep -Fq '\''${cep_part1}${cep_part2}'\'' "$config" &&
            grep -Fq '\''(?<cep>\d{8})'\'' "$config" &&
            ! grep -Fq '\''${NGINX_DNS_RESOLVER}'\'' "$config"
          '
          # A pesquisa por endereço abaixo verifica a resolução usada pelo próprio Nginx.

      - name: Test - Alternate DNS on a Docker network
        run: |
          docker network create opencep-dns-test
          docker run -d --name opencep-dns-test --network opencep-dns-test -p 8081:80 \
            -e NGINX_DNS_RESOLVER=127.0.0.11 opencep-api:test
          docker exec opencep-dns-test nginx -t
          docker exec opencep-dns-test sh -c '
            config=/etc/nginx/conf.d/default.conf
            grep -Fq "resolver 127.0.0.11 valid=300s ipv6=off;" "$config" &&
            grep -Fq '\''proxy_pass https://$viacep_host$request_uri;'\'' "$config" &&
            grep -Fq '\''${cep_part1}${cep_part2}'\'' "$config" &&
            grep -Fq '\''(?<cep>\d{8})'\'' "$config" &&
            ! grep -Fq '\''${NGINX_DNS_RESOLVER}'\'' "$config"
          '
          response=$(curl -fsS http://localhost:8081/health)
          grep -q '"status":"ok"' <<< "$response"
          response=$(curl -fsS http://localhost:8081/v1/01001000.json)
          grep -q '"cep"' <<< "$response"
          response=$(curl -fsS http://localhost:8081/ws/RS/Porto%20Alegre/Domingos/json)
          grep -Eq '\[|"cep"' <<< "$response"
          # Exercita também o @fallback_viacep; o ViaCEP pode retornar erro ou CEP.
          response=$(curl -fsS http://localhost:8081/ws/99999999/json/)
          grep -Eq '"erro"|"cep"' <<< "$response"

      - name: Test - Health Check
        run: |
          echo "Testing health check endpoint..."
          response=$(curl -s http://localhost:8080/health)
          echo "Response: $response"
          
          if echo "$response" | grep -q '"status":"ok"'; then
            echo "✅ Health check passed"
          else
            echo "❌ Health check failed"
            exit 1
          fi

      - name: Test - CEP Lookup (Local Cache)
        run: |
          echo "Testing CEP lookup from local cache..."
          response=$(curl -s http://localhost:8080/ws/01001000/json/)
          echo "Response: $response"
          
          if echo "$response" | grep -q '"cep"'; then
            echo "✅ CEP lookup passed"
          else
            echo "❌ CEP lookup failed"
            exit 1
          fi

      - name: Test - Address Search (ViaCEP Proxy)
        run: |
          echo "Testing address search via ViaCEP proxy..."
          response=$(curl -s http://localhost:8080/ws/RS/Porto%20Alegre/Domingos/json)
          echo "Response: $response"
          
          if echo "$response" | grep -q '\[' || echo "$response" | grep -q '"cep"'; then
            echo "✅ Address search passed"
          else
            echo "❌ Address search failed"
            exit 1
          fi

      - name: Test - Direct v1 Access
        run: |
          echo "Testing direct v1 JSON access..."
          response=$(curl -s http://localhost:8080/v1/01001000.json)
          echo "Response: $response"
          
          if echo "$response" | grep -q '"cep"'; then
            echo "✅ Direct v1 access passed"
          else
            echo "❌ Direct v1 access failed"
            exit 1
          fi

      - name: Test - Homepage
        run: |
          echo "Testing homepage..."
          response=$(curl -s http://localhost:8080/)
          echo "Response (first 200 chars): ${response:0:200}"
          
          if echo "$response" | grep -q 'OpenCEP' || echo "$response" | grep -q 'API'; then
            echo "✅ Homepage passed"
          else
            echo "❌ Homepage failed"
            exit 1
          fi

      - name: Test - CORS Preflight Request
        run: |
          echo "Testing CORS preflight request..."
          response_headers=$(curl -i -s -X OPTIONS -H "Origin: https://example.com" -H "Access-Control-Request-Method: GET" http://localhost:8080/ws/01001000/json/)
          echo "Response headers:"
          echo "$response_headers"
          
          if echo "$response_headers" | grep -iq "access-control-allow-origin: *"; then
            echo "✅ CORS preflight test passed"
          else
            echo "❌ CORS preflight test failed"
            exit 1
          fi

      - name: Test - CORS Headers Not Duplicated on ViaCEP Fallback
        run: |
          echo "Testing CORS headers are not duplicated when request falls back to ViaCEP..."
          response_headers=$(curl -i -s http://localhost:8080/ws/99999999/json/)
          echo "Response headers:"
          echo "$response_headers"

          origin_count=$(echo "$response_headers" | grep -ic "^access-control-allow-origin:")
          methods_count=$(echo "$response_headers" | grep -ic "^access-control-allow-methods:")
          headers_count=$(echo "$response_headers" | grep -ic "^access-control-allow-headers:")

          echo "access-control-allow-origin occurrences: $origin_count"
          echo "access-control-allow-methods occurrences: $methods_count"
          echo "access-control-allow-headers occurrences: $headers_count"

          if [ "$origin_count" -eq 1 ] && [ "$methods_count" -eq 1 ] && [ "$headers_count" -eq 1 ]; then
            echo "✅ CORS headers are not duplicated on fallback"
          else
            echo "❌ CORS headers are duplicated on fallback"
            exit 1
          fi

      - name: Show container logs
        if: failure()
        run: |
          docker logs opencep-test || true
          docker logs opencep-dns-test || true
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs || true

      - name: Stop test container
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml down || true
          docker rm -f opencep-test opencep-dns-test || true
          docker network rm opencep-dns-test || true

      - name: Build and push Docker image
        if: success()
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image tags
        if: success()
        run: |
          echo "✅ Image successfully pushed to GitHub Container Registry!"
          echo ""
          echo "Published tags:"
          echo "${{ steps.meta.outputs.tags }}"
          echo ""
          echo "Pull command:"
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "docker pull ghcr.io/${{ github.repository }}:pr-${{ github.event.pull_request.number }}"
          else
            echo "docker pull ghcr.io/${{ github.repository }}:latest"
          fi
