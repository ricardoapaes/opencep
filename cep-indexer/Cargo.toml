[package]
name = "cep-indexer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "indexer"
path = "src/indexer.rs"

[[bin]]
name = "search-server"
path = "src/server.rs"

[dependencies]
tokio = { version = "1.41", features = ["full"] }
axum = "0.7"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tantivy = "0.25"
unicode-normalization = "0.1"
walkdir = "2.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
