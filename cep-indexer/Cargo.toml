[package]
name = "cep-indexer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "indexer"
path = "src/indexer.rs"

[[bin]]
name = "search-server"
path = "src/server.rs"

[dependencies]
# Async runtime
tokio = { version = "1.41", features = ["full"] }

# HTTP server
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Database
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# JSON serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
walkdir = "2.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
urlencoding = "2.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
